<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#071527" />
      <stop offset="100%" stop-color="#0d1b2a" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Dynamic Pulse Gradient for Flow Lines -->
    <linearGradient id="flow-pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.1" />
    </linearGradient>

    <!-- Drop Shadow Filter for Text & Elements -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .grid-line { stroke: #1e293b; stroke-width: 1; stroke-dasharray: 4 4; opacity: 0.3; }

    /* Dynamic SVG Animations */
    @keyframes pulse-flow {
      0% { stroke-dashoffset: 800; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes float-gentle {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }

    @keyframes bar-grow {
      0% { transform: scaleY(0.3); }
      50% { transform: scaleY(1.0); }
      100% { transform: scaleY(0.3); }
    }

    .animated-flow {
      stroke-dasharray: 40 160;
      animation: pulse-flow 6s linear infinite;
    }

    .floating-card-1 {
      animation: float-gentle 6s ease-in-out infinite;
    }

    .floating-card-2 {
      animation: float-gentle 7s ease-in-out 1s infinite;
    }

    .equalizer-bar-1 { animation: bar-grow 2s ease-in-out 0.1s infinite; transform-origin: bottom; }
    .equalizer-bar-2 { animation: bar-grow 2.4s ease-in-out 0.4s infinite; transform-origin: bottom; }
    .equalizer-bar-3 { animation: bar-grow 1.8s ease-in-out 0.2s infinite; transform-origin: bottom; }
    .equalizer-bar-4 { animation: bar-grow 2.2s ease-in-out 0.5s infinite; transform-origin: bottom; }

    /* Text & Typography */
    .banner-badge {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 700;
      fill: #38bdf8;
      letter-spacing: 1px;
    }

    .banner-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 34px;
      font-weight: 800;
      fill: url(#title-grad);
      letter-spacing: -0.5px;
    }

    .banner-subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px;
      font-weight: 500;
      fill: #94a3b8;
    }

    .chip-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 12px;
      font-weight: 600;
      fill: #cbd5e1;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="360" rx="12" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Background Grid -->
  <g>
    <line x1="150" y1="0" x2="150" y2="360" class="grid-line" />
    <line x1="350" y1="0" x2="350" y2="360" class="grid-line" />
    <line x1="550" y1="0" x2="550" y2="360" class="grid-line" />
    <line x1="750" y1="0" x2="750" y2="360" class="grid-line" />
    <line x1="950" y1="0" x2="950" y2="360" class="grid-line" />
    <line x1="0" y1="90" x2="1200" y2="90" class="grid-line" />
    <line x1="0" y1="180" x2="1200" y2="180" class="grid-line" />
    <line x1="0" y1="270" x2="1200" y2="270" class="grid-line" />
  </g>

  <!-- Dynamic Animated Data Stream Lines (Background layer) -->
  <g>
    <path d="M 50 300 Q 300 350 600 280 T 1150 310" fill="none" stroke="#1e293b" stroke-width="2" />
    <path d="M 50 300 Q 300 350 600 280 T 1150 310" fill="none" stroke="url(#flow-pulse)" stroke-width="4" class="animated-flow" />

    <path d="M 100 60 Q 400 20 700 70 T 1180 40" fill="none" stroke="#1e293b" stroke-width="2" />
    <path d="M 100 60 Q 400 20 700 70 T 1180 40" fill="none" stroke="url(#flow-pulse)" stroke-width="3" class="animated-flow" style="animation-duration: 4s;" />
  </g>

  <!-- Right Decorative Element 1: DB Architecture Node Card -->
  <g class="floating-card-1" transform="translate(860, 45)" filter="url(#shadow)">
    <rect width="280" height="135" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />
    <text x="20" y="30" font-family="sans-serif" font-size="11" font-weight="700" fill="#64748b" letter-spacing="0.5">HIGH AVAILABILITY REPLICATION</text>

    <!-- DB Stack Icon -->
    <g transform="translate(20, 45)">
      <ellipse cx="25" cy="12" rx="22" ry="7" fill="#38bdf8" />
      <path d="M 3 12 L 3 24 C 3 28, 47 28, 47 24 L 47 12" fill="none" stroke="#38bdf8" stroke-width="2" />
      <path d="M 3 24 L 3 36 C 3 40, 47 40, 47 36 L 47 24" fill="none" stroke="#818cf8" stroke-width="2" />
      <path d="M 3 36 L 3 48 C 3 52, 47 52, 47 48 L 47 36" fill="none" stroke="#c084fc" stroke-width="2" />
    </g>

    <!-- Equalizer Dynamic Bars -->
    <g transform="translate(85, 92)">
      <rect x="0" y="-35" width="6" height="35" rx="2" fill="#38bdf8" class="equalizer-bar-1" />
      <rect x="12" y="-35" width="6" height="35" rx="2" fill="#818cf8" class="equalizer-bar-2" />
      <rect x="24" y="-35" width="6" height="35" rx="2" fill="#c084fc" class="equalizer-bar-3" />
      <rect x="36" y="-35" width="6" height="35" rx="2" fill="#4ade80" class="equalizer-bar-4" />
    </g>

    <!-- Cluster Status Tag -->
    <rect x="160" y="60" width="100" height="26" rx="13" fill="#064e3b" stroke="#059669" stroke-width="1" />
    <circle cx="174" cy="73" r="4" fill="#34d399" />
    <text x="184" y="77" font-family="sans-serif" font-size="11" font-weight="700" fill="#34d399">ACTIVE HA</text>
  </g>

  <!-- Right Decorative Element 2: Engine Compatibility Card -->
  <g class="floating-card-2" transform="translate(860, 200)" filter="url(#shadow)">
    <rect width="280" height="115" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />
    <text x="20" y="28" font-family="sans-serif" font-size="11" font-weight="700" fill="#64748b" letter-spacing="0.5">MANAGED ENGINES</text>

    <!-- Engine Pills -->
    <g transform="translate(20, 42)">
      <rect x="0" y="0" width="110" height="26" rx="6" fill="#1e293b" stroke="#0284c7" stroke-width="1" />
      <text x="55" y="17" font-family="sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">🐘 PostgreSQL</text>

      <rect x="120" y="0" width="110" height="26" rx="6" fill="#1e293b" stroke="#d97706" stroke-width="1" />
      <text x="175" y="17" font-family="sans-serif" font-size="11" font-weight="600" fill="#fbbf24" text-anchor="middle">🐬 MySQL</text>

      <rect x="0" y="34" width="110" height="26" rx="6" fill="#1e293b" stroke="#4f46e5" stroke-width="1" />
      <text x="55" y="51" font-family="sans-serif" font-size="11" font-weight="600" fill="#818cf8" text-anchor="middle">⚡ Serverless</text>

      <rect x="120" y="34" width="110" height="26" rx="6" fill="#1e293b" stroke="#059669" stroke-width="1" />
      <text x="175" y="51" font-family="sans-serif" font-size="11" font-weight="600" fill="#34d399" text-anchor="middle">☸️ CloudNativePG</text>
    </g>
  </g>

  <!-- FOREGROUND TEXT CONTENT (Positioned on the left half to avoid overlap) -->
  <g transform="translate(60, 50)" filter="url(#shadow)">
    <!-- Badge -->
    <rect x="0" y="0" width="310" height="26" rx="13" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="14" cy="13" r="4" fill="#38bdf8" />
    <text x="26" y="17" class="banner-badge">CURATED DBaaS LANDSCAPE &amp; ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="70" class="banner-title">Awesome Managed Relational</text>
    <text x="0" y="112" class="banner-title">Database Service (DBaaS)</text>

    <!-- Subtitle -->
    <text x="0" y="152" class="banner-subtitle">SaaS Cloud Platforms, Serverless RDBMS &amp; Open-Source Database Automation</text>

    <!-- Feature Chips -->
    <g transform="translate(0, 182)">
      <rect x="0" y="0" width="130" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="14" y="19" class="chip-text">⚡ Serverless SQL</text>

      <rect x="140" y="0" width="140" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="154" y="19" class="chip-text">🛡️ High Availability</text>

      <rect x="290" y="0" width="170" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="304" y="19" class="chip-text">📦 CloudNativePG / K8s</text>
    </g>
  </g>
</svg>
