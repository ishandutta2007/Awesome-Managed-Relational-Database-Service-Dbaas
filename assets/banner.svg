<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Glow Gradients -->
    <radialGradient id="glowCyan" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowPurple" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Drop Shadow for Foreground Text -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bgGrad); }
    .glow-cyan { fill: url(#glowCyan); }
    .glow-purple { fill: url(#glowPurple); }
    
    /* Dynamic Animated Background Elements */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.08); }
    }
    @keyframes floatNode {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes dashLine {
      to { stroke-dashoffset: -40; }
    }
    @keyframes spinRing {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .anim-pulse { animation: pulseGlow 6s ease-in-out infinite; transform-origin: 900px 180px; }
    .anim-float { animation: floatNode 4s ease-in-out infinite; }
    .anim-dash { stroke-dasharray: 8, 8; animation: dashLine 2s linear infinite; }
    .anim-spin { animation: spinRing 20s linear infinite; transform-origin: 980px 190px; }

    /* Foreground Typography Styling */
    .banner-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 38px;
      font-weight: 800;
      fill: url(#titleGrad);
      letter-spacing: -0.5px;
    }
    .banner-subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 19px;
      font-weight: 400;
      fill: #94a3b8;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #ffffff;
    }
    .grid-line { stroke: #334155; stroke-opacity: 0.3; stroke-width: 1; }
  </style>

  <!-- Base Background -->
  <rect width="1200" height="380" rx="16" class="bg" />

  <!-- Grid Pattern Background -->
  <g class="grid">
    <line x1="100" y1="0" x2="100" y2="380" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="380" class="grid-line" />
    <line x1="500" y1="0" x2="500" y2="380" class="grid-line" />
    <line x1="700" y1="0" x2="700" y2="380" class="grid-line" />
    <line x1="900" y1="0" x2="900" y2="380" class="grid-line" />
    <line x1="1100" y1="0" x2="1100" y2="380" class="grid-line" />

    <line x1="0" y1="80" x2="1200" y2="80" class="grid-line" />
    <line x1="0" y1="180" x2="1200" y2="180" class="grid-line" />
    <line x1="0" y1="280" x2="1200" y2="280" class="grid-line" />
  </g>

  <!-- Dynamic Glowing Orbs (Background Layer) -->
  <rect width="1200" height="380" class="glow-cyan anim-pulse" />
  <rect width="1200" height="380" class="glow-purple" />

  <!-- Animated Network & Database Illustration on Right (Background Layer) -->
  <g id="bg-graphics" transform="translate(40, 0)">
    <!-- Connecting Dashed Animated Lines -->
    <path d="M 850 190 L 980 110 M 980 110 L 1060 220 M 980 110 L 980 270" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4" class="anim-dash" />
    
    <!-- Rotating Ring -->
    <circle cx="980" cy="190" r="110" fill="none" stroke="#6366f1" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="12, 12" class="anim-spin" />

    <!-- Node 1: Main DB Cylinder -->
    <g transform="translate(940, 150)" class="anim-float">
      <!-- Database Cylinder Icon -->
      <path d="M0 15 C0 5, 80 5, 80 15 L80 65 C80 75, 0 75, 0 65 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
      <ellipse cx="40" cy="15" rx="40" ry="10" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
      <path d="M0 35 C0 45, 80 45, 80 35" fill="none" stroke="#38bdf8" stroke-width="2"/>
      <path d="M0 55 C0 65, 80 65, 80 55" fill="none" stroke="#38bdf8" stroke-width="2"/>
    </g>

    <!-- Node 2: Small Cloud Node -->
    <g transform="translate(830, 170)">
      <circle cx="20" cy="20" r="24" fill="#0f172a" stroke="#818cf8" stroke-width="2" />
      <text x="20" y="25" text-anchor="middle" fill="#818cf8" font-size="14" font-family="sans-serif" font-weight="bold">☁️</text>
    </g>

    <!-- Node 3: PostgreSQL Server Node -->
    <g transform="translate(1040, 200)">
      <circle cx="20" cy="20" r="26" fill="#0f172a" stroke="#c084fc" stroke-width="2" />
      <text x="20" y="26" text-anchor="middle" fill="#c084fc" font-size="16" font-family="sans-serif" font-weight="bold">🐘</text>
    </g>
  </g>

  <!-- FOREGROUND LAYER: Content Box, Title, Subtitle, Badges (Strictly in front) -->
  <g id="foreground-content" transform="translate(60, 50)" filter="url(#shadow)">
    
    <!-- Top Pill Badge -->
    <g transform="translate(0, 10)">
      <rect x="0" y="0" width="280" height="32" rx="16" fill="url(#badgeGrad)" opacity="0.9" />
      <text x="140" y="21" text-anchor="middle" class="pill-text">⚡ AWESOME DBaaS ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="95" class="banner-title">Awesome Managed Relational</text>
    <text x="0" y="140" class="banner-title">Database Service (DBaaS)</text>

    <!-- Subtitle -->
    <text x="0" y="185" class="banner-subtitle">Curated SaaS Platforms, Serverless SQL &amp; Self-Hosted Database Automation</text>

    <!-- Feature Tags Row -->
    <g transform="translate(0, 220)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="130" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <text x="65" y="20" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">☁️ Cloud DBaaS</text>

      <!-- Tag 2 -->
      <rect x="142" y="0" width="150" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <text x="217" y="20" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">🐘 PostgreSQL &amp; SQL</text>

      <!-- Tag 3 -->
      <rect x="304" y="0" width="140" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <text x="374" y="20" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">⚡ Serverless SQL</text>

      <!-- Tag 4 -->
      <rect x="456" y="0" width="165" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <text x="538.5" y="20" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">🛠️ Open-Source HA</text>
    </g>

  </g>
</svg>
