<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Dark tech gradient background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1035" />
    </linearGradient>

    <!-- Vibrant accent gradients -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glassmorphic Card Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.2" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        fill: #ffffff;
      }
      .gradient-text {
        fill: url(#cyanPurple);
      }
      .subtitle {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 18px;
        fill: #94a3b8;
      }
      .badge-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #38bdf8;
      }

      /* CSS Animations */
      @keyframes pulseLine {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      @keyframes nodeGlow {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.9; transform: scale(1.15); }
      }
      @keyframes barGrow {
        0%, 100% { transform: scaleY(0.9); }
        50% { transform: scaleY(1.1); }
      }
      @keyframes particleMove {
        0% { transform: translate(0, 0); opacity: 0; }
        50% { opacity: 0.8; }
        100% { transform: translate(60px, -40px); opacity: 0; }
      }

      .animated-line {
        stroke-dasharray: 12, 12;
        animation: pulseLine 6s linear infinite;
      }
      .floating-node-1 { animation: floatSlow 5s ease-in-out infinite; }
      .floating-node-2 { animation: floatReverse 6s ease-in-out infinite; }
      .glowing-dot { animation: nodeGlow 3s ease-in-out infinite; transform-origin: center; }
      .anim-bar-1 { animation: barGrow 4s ease-in-out infinite; transform-origin: bottom; }
      .anim-bar-2 { animation: barGrow 3.5s ease-in-out 0.5s infinite; transform-origin: bottom; }
      .anim-bar-3 { animation: barGrow 4.5s ease-in-out 1s infinite; transform-origin: bottom; }
      .particle { animation: particleMove 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Base Card Container -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Dynamic Ambient Background Glows -->
  <circle cx="150" cy="100" r="180" fill="#0369a1" opacity="0.15" filter="url(#glow)" />
  <circle cx="1050" cy="320" r="200" fill="#7e22ce" opacity="0.15" filter="url(#glow)" />

  <!-- DYNAMIC / ANIMATED BACKGROUND ELEMENTS (Layered BEHIND Foreground Text Backdrop) -->

  <!-- Left Side: Database Cluster Visualization -->
  <g class="floating-node-1">
    <!-- Connecting Flow Lines -->
    <path d="M 90 140 Q 150 100 210 160 T 270 240" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4" class="animated-line" />
    <path d="M 70 280 Q 140 240 200 300" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.4" class="animated-line" />

    <!-- DB Node 1 (Postgres/Relational Cylinder) -->
    <g transform="translate(70, 110)">
      <rect x="0" y="0" width="70" height="50" rx="10" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.5" opacity="0.85" />
      <path d="M 15 15 C 15 10, 55 10, 55 15 C 55 20, 15 20, 15 15 Z" fill="none" stroke="#38bdf8" stroke-width="1.5" />
      <path d="M 15 25 C 15 20, 55 20, 55 25 C 55 30, 15 30, 15 25 Z" fill="none" stroke="#38bdf8" stroke-width="1.5" />
      <path d="M 15 35 C 15 30, 55 30, 55 35 C 55 40, 15 40, 15 35 Z" fill="none" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="58" cy="12" r="4" fill="#10b981" class="glowing-dot" />
    </g>

    <!-- DB Node 2 (Cloud DB) -->
    <g transform="translate(170, 250)">
      <rect x="0" y="0" width="90" height="44" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" opacity="0.85" />
      <text x="45" y="26" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#c084fc" font-weight="600">HA CLUSTER</text>
      <circle cx="78" cy="10" r="4" fill="#38bdf8" class="glowing-dot" />
    </g>
  </g>

  <!-- Right Side: Animated Metrics / Dynamic Bar Chart & Serverless Branching -->
  <g class="floating-node-2">
    <!-- Connecting Pipelines -->
    <path d="M 930 150 Q 1000 200 1080 140" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.4" class="animated-line" />
    <path d="M 960 280 Q 1040 240 1110 290" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.4" class="animated-line" />

    <!-- Mini Dynamic Graph Box -->
    <g transform="translate(970, 100)">
      <rect x="0" y="0" width="140" height="90" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" opacity="0.85" />
      <text x="15" y="24" font-family="sans-serif" font-size="11" fill="#94a3b8" font-weight="600">TPS / Scaling</text>
      <!-- Animated Chart Bars -->
      <rect class="anim-bar-1" x="20" y="40" width="14" height="35" rx="3" fill="#38bdf8" />
      <rect class="anim-bar-2" x="42" y="32" width="14" height="43" rx="3" fill="#818cf8" />
      <rect class="anim-bar-3" x="64" y="48" width="14" height="27" rx="3" fill="#c084fc" />
      <rect class="anim-bar-1" x="86" y="25" width="14" height="50" rx="3" fill="#34d399" />
      <rect class="anim-bar-2" x="108" y="38" width="14" height="37" rx="3" fill="#f472b6" />
    </g>

    <!-- Serverless Branching Pill -->
    <g transform="translate(940, 260)">
      <rect x="0" y="0" width="150" height="42" rx="21" fill="#1e293b" stroke="#34d399" stroke-width="1.5" opacity="0.85" />
      <circle cx="22" cy="21" r="6" fill="#34d399" class="glowing-dot" />
      <text x="36" y="25" font-family="sans-serif" font-size="12" fill="#e2e8f0" font-weight="600">Scale-to-Zero</text>
    </g>
  </g>

  <!-- Floating particles -->
  <circle cx="200" cy="80" r="2.5" fill="#38bdf8" class="particle" />
  <circle cx="1020" cy="360" r="3" fill="#a855f7" class="particle" style="animation-delay: 1.5s;" />
  <circle cx="150" cy="350" r="2" fill="#34d399" class="particle" style="animation-delay: 2.5s;" />

  <!-- FOREGROUND TEXT BACKDROP (Glassmorphic Shield ensuring 100% readability & contrast) -->
  <g transform="translate(240, 50)">
    <!-- Central Glass Shield -->
    <rect x="0" y="0" width="720" height="320" rx="20" fill="url(#glassGrad)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" />
    <rect x="1" y="1" width="718" height="318" rx="19" fill="#0f172a" fill-opacity="0.75" />

    <!-- Top Pill Badge -->
    <g transform="translate(240, 30)">
      <rect x="0" y="0" width="240" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" filter="url(#softGlow)" />
      <circle cx="16" cy="15" r="4" fill="#38bdf8" class="glowing-dot" />
      <text x="120" y="19" text-anchor="middle" class="badge-text" letter-spacing="1">CURATED DBaaS ECOSYSTEM</text>
    </g>

    <!-- Main Title (Strictly Foreground & Unobscured) -->
    <text x="360" y="115" text-anchor="middle" class="title">
      Awesome <tspan class="gradient-text">Managed SQL</tspan>
    </text>
    <text x="360" y="165" text-anchor="middle" class="title" font-size="34">
      &amp; Relational DBaaS
    </text>

    <!-- Subtitle (Strictly Foreground & Unobscured) -->
    <text x="360" y="215" text-anchor="middle" class="subtitle">
      SaaS Cloud Databases • Serverless RDBMS • Self-Hosted Automation
    </text>

    <!-- Feature Tags Row -->
    <g transform="translate(70, 248)">
      <!-- Tag 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="125" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="62.5" y="18" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#cbd5e1" font-weight="500">PostgreSQL</text>
      </g>
      <!-- Tag 2 -->
      <g transform="translate(140, 0)">
        <rect x="0" y="0" width="110" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="55" y="18" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#cbd5e1" font-weight="500">MySQL</text>
      </g>
      <!-- Tag 3 -->
      <g transform="translate(265, 0)">
        <rect x="0" y="0" width="145" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="72.5" y="18" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#cbd5e1" font-weight="500">Distributed SQL</text>
      </g>
      <!-- Tag 4 -->
      <g transform="translate(425, 0)">
        <rect x="0" y="0" width="155" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="77.5" y="18" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#cbd5e1" font-weight="500">K8s Operators</text>
      </g>
    </g>
  </g>
</svg>
