<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#071527" />
      <stop offset="100%" stop-color="#0d1b2a" />
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="glow-purple" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Text Shadow Filter for Guaranteed Readability -->
    <filter id="text-backdrop" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.9"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .grid-line { stroke: #1e293b; stroke-width: 1; stroke-dasharray: 4 4; opacity: 0.4; }
    
    /* Dynamic Animated Background Data Flow Lines */
    .flow-line {
      fill: none;
      stroke-width: 2;
      opacity: 0.35;
    }
    
    .pulse-dot {
      animation: pulse-move 4s infinite linear;
    }

    .pulse-dot-2 {
      animation: pulse-move 6s infinite ease-in-out;
    }

    @keyframes pulse-move {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }

    /* Floating Nodes Animation */
    .float-node-1 { animation: float-1 5s ease-in-out infinite alternate; }
    .float-node-2 { animation: float-2 7s ease-in-out infinite alternate; }
    .float-node-3 { animation: float-3 6s ease-in-out infinite alternate; }

    @keyframes float-1 {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(-12px) scale(1.03); }
    }
    @keyframes float-2 {
      0% { transform: translateY(0px); }
      100% { transform: translateY(10px); }
    }
    @keyframes float-3 {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }

    /* Wave animation for SQL signal */
    .wave-bar {
      animation: wave-height 2s ease-in-out infinite alternate;
      transform-origin: bottom;
    }
    @keyframes wave-height {
      0% { transform: scaleY(0.4); }
      100% { transform: scaleY(1.1); }
    }

    /* Title & Subtitle Styling */
    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 38px;
      fill: url(#title-grad);
      letter-spacing: -0.5px;
    }

    .subtitle-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 16px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }

    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #38bdf8;
    }
  </style>

  <!-- Base Dark Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Background Tech Grid Overlay -->
  <g class="grid-layer">
    <line x1="100" y1="0" x2="100" y2="360" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="360" class="grid-line" />
    <line x1="500" y1="0" x2="500" y2="360" class="grid-line" />
    <line x1="700" y1="0" x2="700" y2="360" class="grid-line" />
    <line x1="900" y1="0" x2="900" y2="360" class="grid-line" />
    <line x1="1100" y1="0" x2="1100" y2="360" class="grid-line" />
    
    <line x1="0" y1="60" x2="1200" y2="60" class="grid-line" />
    <line x1="0" y1="140" x2="1200" y2="140" class="grid-line" />
    <line x1="0" y1="220" x2="1200" y2="220" class="grid-line" />
    <line x1="0" y1="300" x2="1200" y2="300" class="grid-line" />
  </g>

  <!-- DYNAMIC ANIMATED BACKGROUND ELEMENTS (Z-INDEX: LOW - Behind Foreground Text) -->
  
  <!-- Network Topology / Database Mesh Lines -->
  <g class="mesh-lines">
    <!-- Animated Flow 1 -->
    <path d="M 100 280 Q 250 320 400 270 T 800 290 T 1100 240" class="flow-line" stroke="#38bdf8" stroke-dasharray="12 12" />
    <path d="M 100 280 Q 250 320 400 270 T 800 290 T 1100 240" class="flow-line pulse-dot" stroke="#818cf8" stroke-dasharray="8 200" stroke-width="4" filter="url(#glow-cyan)" />

    <!-- Animated Flow 2 -->
    <path d="M 50 100 Q 300 40 600 90 T 1150 70" class="flow-line" stroke="#818cf8" stroke-dasharray="8 8" />
    <path d="M 50 100 Q 300 40 600 90 T 1150 70" class="flow-line pulse-dot-2" stroke="#c084fc" stroke-dasharray="12 300" stroke-width="4" filter="url(#glow-purple)" />
  </g>

  <!-- Background Decorative Dynamic Database Nodes (Positioned dynamically on right and bottom sides to avoid title center opacity) -->

  <!-- Node 1: Floating Database Cylinder Stack (Right Side) -->
  <g class="float-node-1" transform="translate(940, 75)">
    <!-- Outer Glow Aura -->
    <circle cx="90" cy="90" r="85" fill="#38bdf8" opacity="0.05" filter="url(#glow-cyan)" />
    
    <!-- Database Cylinder 1 (Top) -->
    <path d="M 50 50 C 50 40, 130 40, 130 50 C 130 60, 50 60, 50 50 Z" fill="#38bdf8" opacity="0.9" />
    <path d="M 50 50 L 50 75 C 50 85, 130 85, 130 75 L 130 50" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path d="M 50 75 C 50 85, 130 85, 130 75" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6" />
    
    <!-- Database Cylinder 2 (Middle) -->
    <path d="M 50 75 L 50 100 C 50 110, 130 110, 130 100 L 130 75" fill="none" stroke="#818cf8" stroke-width="2" />
    <path d="M 50 100 C 50 110, 130 110, 130 100" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.6" />

    <!-- Database Cylinder 3 (Bottom) -->
    <path d="M 50 100 L 50 125 C 50 135, 130 135, 130 125 L 130 100" fill="none" stroke="#c084fc" stroke-width="2" />
    <path d="M 50 125 C 50 135, 130 135, 130 125" fill="none" stroke="#c084fc" stroke-width="2" opacity="0.8" />

    <!-- Server Pulse Indicators -->
    <circle cx="65" cy="53" r="3" fill="#4ade80" />
    <circle cx="75" cy="53" r="3" fill="#60a5fa" />
    <circle cx="65" cy="78" r="3" fill="#4ade80" />
    <circle cx="65" cy="103" r="3" fill="#4ade80" />
  </g>

  <!-- Node 2: Live Metrics / Graph Card (Bottom Right Accent) -->
  <g class="float-node-2" transform="translate(850, 220)">
    <rect width="260" height="95" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />
    <text x="18" y="28" font-family="sans-serif" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="0.5">CLUSTER REPLICATION &amp; HA</text>

    <!-- Animated Equalizer / Database Traffic Bars -->
    <g transform="translate(18, 42)">
      <!-- Bar 1 -->
      <rect class="wave-bar" x="0" y="0" width="8" height="35" rx="3" fill="#38bdf8" style="animation-delay: 0.1s" />
      <rect class="wave-bar" x="14" y="0" width="8" height="35" rx="3" fill="#818cf8" style="animation-delay: 0.4s" />
      <rect class="wave-bar" x="28" y="0" width="8" height="35" rx="3" fill="#38bdf8" style="animation-delay: 0.2s" />
      <rect class="wave-bar" x="42" y="0" width="8" height="35" rx="3" fill="#c084fc" style="animation-delay: 0.6s" />
      <rect class="wave-bar" x="56" y="0" width="8" height="35" rx="3" fill="#4ade80" style="animation-delay: 0.3s" />
    </g>

    <!-- Status pill -->
    <rect x="150" y="48" width="92" height="24" rx="12" fill="#065f46" opacity="0.6" />
    <circle cx="164" cy="60" r="4" fill="#34d399" />
    <text x="174" y="64" font-family="sans-serif" font-size="11" font-weight="600" fill="#34d399">99.999% HA</text>
  </g>

  <!-- Node 3: PostgreSQL / MySQL Engine Cluster Nodes (Left Side Subtle Accent) -->
  <g class="float-node-3" transform="translate(60, 210)">
    <rect width="180" height="105" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />
    <text x="16" y="28" font-family="sans-serif" font-size="11" font-weight="700" fill="#94a3b8">ENGINE COMPATIBILITY</text>
    
    <!-- Engine Pills -->
    <rect x="16" y="40" width="70" height="22" rx="6" fill="#1e293b" stroke="#0284c7" stroke-width="1" />
    <text x="51" y="55" font-family="sans-serif" font-size="10" font-weight="600" fill="#38bdf8" text-anchor="middle">PostgreSQL</text>
    
    <rect x="94" y="40" width="68" height="22" rx="6" fill="#1e293b" stroke="#d97706" stroke-width="1" />
    <text x="128" y="55" font-family="sans-serif" font-size="10" font-weight="600" fill="#fbbf24" text-anchor="middle">MySQL</text>

    <rect x="16" y="70" width="70" height="22" rx="6" fill="#1e293b" stroke="#6366f1" stroke-width="1" />
    <text x="51" y="85" font-family="sans-serif" font-size="10" font-weight="600" fill="#a5b4fc" text-anchor="middle">Serverless</text>
    
    <rect x="94" y="70" width="68" height="22" rx="6" fill="#1e293b" stroke="#059669" stroke-width="1" />
    <text x="128" y="85" font-family="sans-serif" font-size="10" font-weight="600" fill="#34d399" text-anchor="middle">Cloud Native</text>
  </g>

  <!-- FOREGROUND CONTENT - HIGH PRIORITY READABILITY & IMMUTABLE VISIBILITY -->
  <g transform="translate(70, 0)" filter="url(#text-backdrop)">
    
    <!-- Category Tag / Badge -->
    <g transform="translate(0, 65)">
      <rect width="280" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" opacity="0.9" />
      <circle cx="16" cy="14" r="5" fill="#38bdf8" />
      <text x="30" y="18" class="badge-text">CURATED DBaaS LANDSCAPE &amp; ECOSYSTEM</text>
    </g>

    <!-- Main Title (Guaranteed foreground placement) -->
    <text x="0" y="145" class="title-text">
      Awesome Managed Relational Database
    </text>
    <text x="0" y="190" class="title-text">
      Service (DBaaS)
    </text>

    <!-- Subtitle -->
    <text x="0" y="232" class="subtitle-text">
      SaaS Cloud Platforms, Serverless RDBMS &amp; Open-Source Database Automation
    </text>

    <!-- Highlights / Key Focus Chips -->
    <g transform="translate(0, 260)">
      <!-- Chip 1 -->
      <rect x="0" y="0" width="135" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="12" y="18" font-family="sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">⚡ Serverless SQL</text>

      <!-- Chip 2 -->
      <rect x="145" y="0" width="145" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="157" y="18" font-family="sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">🛡️ High Availability</text>

      <!-- Chip 3 -->
      <rect x="300" y="0" width="165" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="312" y="18" font-family="sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">📦 CloudNativePG / K8s</text>
    </g>
  </g>

</svg>
